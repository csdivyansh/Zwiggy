{% extends 'base.html' %} {% block title %}Edit Menu Item - Zwiggy{% endblock %}
{% block content %}
<section
  class="section"
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  "
>
  <div class="container" style="max-width: 600px">
    <div class="card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div style="font-size: 2.5rem; margin-bottom: 1rem">✏️</div>
          <h2>Edit Menu Item</h2>
          <p style="color: var(--text-secondary)">{{ item.name }}</p>
        </div>

        <form
          action="{{ url_for('editMenuItem', restaurant_id=restaurant_id, menu_id=item.id) }}"
          method="POST"
        >
          <div class="form-group">
            <label>Item Name *</label>
            <input
              class="form-control"
              type="text"
              name="name"
              placeholder="{{ item.name }}"
              value="{{ item.name }}"
              required
            />
          </div>

          <div class="flex" style="gap: 1rem">
            <button class="btn btn-primary btn-block" type="submit">
              Save Changes
            </button>
            <a
              href="{{ url_for('restaurantMenu', restaurant_id=item.restaurant_id) }}"
              class="btn btn-secondary btn-block"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
