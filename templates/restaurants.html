{% extends 'base.html' %} {% block title %}Restaurants - Zwiggy{% endblock %} {%
block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Restaurants</h2>
  <form class="d-flex" method="GET" action="{{ url_for('search_restaurant') }}">
    <input
      class="form-control me-2"
      type="search"
      name="query"
      placeholder="Search restaurants..."
      value="{{ query }}"
    />
    <button class="btn btn-outline-secondary" type="submit">Search</button>
  </form>
</div>

<div class="list-group">
  {% if restaurants %} {% for r in restaurants %}
  <a
    class="list-group-item list-group-item-action"
    href="{{ url_for('UserMenu', restaurant_id=r.id) }}"
    >{{ r.name }}</a
  >
  {% endfor %} {% else %}
  <div class="alert alert-warning">No restaurants found.</div>
  {% endif %}
</div>
{% endblock %}
