{% extends 'base.html' %} {% block title %}Add Menu Item - Zwiggy{% endblock %}
{% block content %}
<section
  class="section"
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  "
>
  <div class="container" style="max-width: 600px">
    <div class="card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div style="font-size: 2.5rem; margin-bottom: 1rem">➕</div>
          <h2>Add New Menu Item</h2>
          <p style="color: var(--text-secondary)">to {{ restaurant.name }}</p>
        </div>

        <form
          action="{{ url_for('newMenuItem', restaurant_id=restaurant.id) }}"
          method="POST"
        >
          <div class="form-group">
            <label>Item Name *</label>
            <input
              class="form-control"
              type="text"
              name="name"
              placeholder="e.g., Butter Chicken"
              required
            />
          </div>

          <div class="form-group">
            <label>Course/Category</label>
            <input
              class="form-control"
              type="text"
              name="course"
              placeholder="e.g., Main Course"
            />
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea
              class="form-control"
              name="description"
              placeholder="Describe your item..."
              rows="4"
            ></textarea>
          </div>

          <div class="form-group">
            <label>Price (₹) *</label>
            <input
              class="form-control"
              type="number"
              name="price"
              step="0.01"
              placeholder="0.00"
              required
            />
          </div>

          <div class="flex" style="gap: 1rem">
            <button class="btn btn-primary btn-block" type="submit">
              Create Item
            </button>
            <a
              href="{{ url_for('restaurantMenu', restaurant_id=restaurant.id) }}"
              class="btn btn-secondary btn-block"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
