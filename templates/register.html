{% extends 'base.html' %}
{% block title %}Register - Zwiggy{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Create an Account</h3>
          <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
              <input class="form-control" type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
              <input class="form-control" type="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="mb-3 d-flex align-items-center">
              <img id="captcha-image" src="{{ url_for('captcha_image') }}" alt="Captcha" class="me-3" style="height:50px;" />
              <a href="#" id="refresh-captcha">Refresh</a>
            </div>

            <div class="mb-3">
              <input class="form-control" type="text" name="captcha" placeholder="Enter the CAPTCHA text" required />
            </div>

            <button class="btn btn-primary w-100" type="submit">Register</button>
          </form>
          <p class="mt-3">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('refresh-captcha')?.addEventListener('click', function(e){
  e.preventDefault();
  const captchaImage = document.getElementById('captcha-image');
  captchaImage.src = "{{ url_for('captcha_image') }}" + '?t=' + Date.now();
});
</script>
{% endblock %}
