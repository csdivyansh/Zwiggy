{% extends 'base.html' %} {% block title %}Login - Zwiggy{% endblock %} {% block
content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Login</h3>
        <form action="{{ url_for('login') }}" method="POST">
          <div class="mb-3">
            <input
              class="form-control"
              type="text"
              name="username"
              placeholder="Username"
              required
            />
          </div>
          <div class="mb-3">
            <input
              class="form-control"
              type="password"
              name="password"
              placeholder="Password"
              required
            />
          </div>

          <div class="mb-3 d-flex align-items-center">
            <img
              id="captcha-image"
              src="{{ url_for('captcha_image') }}"
              alt="Captcha"
              class="me-3"
              style="height: 50px"
            />
            <a href="#" id="refresh-captcha">Refresh</a>
          </div>

          <div class="mb-3">
            <input
              class="form-control"
              type="text"
              name="captcha"
              placeholder="Enter CAPTCHA"
              required
            />
          </div>

          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <p class="mt-3">
          Don't have an account?
          <a href="{{ url_for('register') }}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  document
    .getElementById("refresh-captcha")
    ?.addEventListener("click", function (e) {
      e.preventDefault();
      const captchaImage = document.getElementById("captcha-image");
      captchaImage.src = "{{ url_for('captcha_image') }}" + "?t=" + Date.now();
    });
</script>
{% endblock %}
